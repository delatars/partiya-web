name: Образ фронта (GHCR)

# Собирает образ статики (Dockerfile: dist + прод-config.json) и кладёт в GHCR.
# Сам выкат делает partiya-api/.github/workflows/deploy.yml: бэк и фронт выкатываются
# одним вызовом (submit требует тело оферты, Q-352). Порядок релиза — partiya-api/docs/DEPLOY.md:
# тег vX.Y.Z ставится в обоих репозиториях; деплой бэка ждёт, пока появится этот образ.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег образа (например v0.3.1 или hotfix-1). Собирается из выбранной ветки/тега."
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Имя и теги образа
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          image="ghcr.io/${owner}/partiya-web"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${tag}"
            echo "${image}:sha-${GITHUB_SHA::12}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # source связывает пакет GHCR с репозиторием (видимость и доступ Actions).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
